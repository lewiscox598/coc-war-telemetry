<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141922">
<!-- Pages serves HTML with max-age=600 and that header cannot be changed here.
     Asking for revalidation shortens the window where a stale copy is served
     silently; the build stamp below makes it visible when one still is. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>{% block title %}{{ clan_name }}{% endblock %}</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ root }}style.css?v={{ css_version }}">
</head>
<body>
<div class="wrap">



  <div class="banner">
    <h1>{% block masthead %}{{ clan_name }}{% endblock %}</h1>
    <nav>
      <a href="{{ root }}" class="{{ 'on' if page == 'clan' }}">Clan</a>
      <a href="{{ root }}me/" class="{{ 'on' if page == 'me' }}">{{ me_name }}</a>
    </nav>
  </div>

  {% block content %}{% endblock %}

  <footer>
    <p>{{ capture_count }} captures since {{ first_capture }} · built {{ generated_at }}</p>
    <p>This material is unofficial and is not endorsed by Supercell.</p>
  </footer>
</div>

<script>
// Everything below is presentation over data already embedded in this page at
// build time. Nothing is fetched, no request leaves the browser, and the API
// token is nowhere near the client.
(function () {
  "use strict";

  /* --- countdown ---------------------------------------------------- */
  function tick() {
    document.querySelectorAll("[data-countdown]").forEach(function (el) {
      var delta = new Date(el.dataset.countdown).getTime() - Date.now();
      if (delta <= 0) { el.textContent = "now"; return; }
      var m = Math.floor(delta / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
      el.textContent = d > 0 ? d + "d " + (h % 24) + "h"
                     : h > 0 ? h + "h " + (m % 60) + "m" : m + "m";
    });
  }
  tick(); setInterval(tick, 30000);

  /* --- table sorting ------------------------------------------------ */
  document.querySelectorAll("table[data-sortable]").forEach(function (table) {
    var body = table.tBodies[0];
    if (!body) return;
    table.querySelectorAll("thead th").forEach(function (th, col) {
      th.addEventListener("click", function () {
        var desc = th.getAttribute("aria-sort") !== "descending";
        table.querySelectorAll("thead th").forEach(function (o) { o.removeAttribute("aria-sort"); });
        th.setAttribute("aria-sort", desc ? "descending" : "ascending");
        Array.prototype.slice.call(body.rows).sort(function (a, b) {
          var x = a.cells[col].dataset.v || a.cells[col].textContent.trim();
          var y = b.cells[col].dataset.v || b.cells[col].textContent.trim();
          var nx = parseFloat(x), ny = parseFloat(y);
          var cmp = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : x.localeCompare(y);
          return desc ? -cmp : cmp;
        }).forEach(function (r) { body.appendChild(r); });
      });
    });
  });

  /* --- THE REPLAY ---------------------------------------------------
     Supercell's API returns current state only, so a war's blow-by-blow is
     gone the moment it ends. This archive kept every poll, and order_num is
     a monotonic per-war sequence -- so the war can be wound back and played
     forward. That is the whole point of the project, made visible. */
  var W = window.__WAR__;
  var slider = document.getElementById("scrub");
  if (!W || !slider || !W.attacks || !W.attacks.length) return;

  var play = document.getElementById("play");
  var caption = document.getElementById("caption");
  var scoreUs = document.getElementById("score-us");
  var scoreThem = document.getElementById("score-them");
  var total = W.attacks.length;
  var sideOf = {};
  W.roster.forEach(function (m) { sideOf[m.tag] = m.side; });

  var arcs = {};
  document.querySelectorAll(".tile[data-tag]").forEach(function (tile) {
    arcs[tile.dataset.tag] = {
      stars: tile.querySelectorAll(".arc span"),
      pct: tile.querySelector(".pct-val"),
      tile: tile
    };
  });

  var shown = {};   // tag -> stars currently painted, so we only animate changes
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function stateAt(t) {
    var best = {}, pct = {};
    for (var i = 0; i < W.attacks.length; i++) {
      var a = W.attacks[i];
      if (a.n > t) break;
      if (!(a.on in best) || a.s > best[a.on]) best[a.on] = a.s;
      if (!(a.on in pct) || a.d > pct[a.on]) pct[a.on] = a.d;
    }
    return { best: best, pct: pct };
  }

  function render(t, animate) {
    var st = stateAt(t), us = 0, them = 0;
    W.roster.forEach(function (m) {
      var s = st.best[m.tag] || 0;
      if (m.side === "opponent") { us += s; } else { them += s; }
      var a = arcs[m.tag];
      if (!a) return;
      for (var i = 0; i < a.stars.length; i++) {
        var lit = i < s;
        var was = a.stars[i].classList.contains("on");
        a.stars[i].classList.toggle("on", lit);
        if (!lit) {
          // Clear the animation class when a star goes dark. Otherwise it
          // accumulates as residue: every star that ever lit keeps "pop"
          // forever, which makes the live state unreadable and leaves a
          // finished animation attached to an element that may reflow.
          a.stars[i].classList.remove("pop");
        } else if (!was && animate && !reduce) {
          a.stars[i].classList.remove("pop");
          void a.stars[i].offsetWidth;          // restart the animation
          a.stars[i].classList.add("pop");
        }
      }
      a.tile.classList.toggle("cleared", s === 3);
      if (a.pct) a.pct.textContent = (st.pct[m.tag] || 0) + "%";
      shown[m.tag] = s;
    });
    if (scoreUs) scoreUs.textContent = us;
    if (scoreThem) scoreThem.textContent = them;

    var a = t > 0 ? W.attacks[t - 1] : null;
    if (caption) {
      caption.innerHTML = a
        ? "Attack <b>" + a.n + "</b> of " + total + " · <b>" + a.s + "★</b> " + a.d + "%"
        : "Before the first attack";
    }
    slider.style.setProperty("--pct", (total ? (t / total) * 100 : 0) + "%");
    slider.setAttribute("aria-valuetext", a ? "attack " + a.n + " of " + total : "start of war");
  }

  slider.addEventListener("input", function () { render(+slider.value, true); });

  var timer = null;
  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    if (play) { play.textContent = "▶ Play"; play.setAttribute("aria-pressed", "false"); }
  }
  if (play) {
    play.addEventListener("click", function () {
      if (timer) { stop(); return; }
      if (+slider.value >= total) { slider.value = 0; render(0, false); }
      play.textContent = "❚❚ Pause";
      play.setAttribute("aria-pressed", "true");
      timer = setInterval(function () {
        var next = +slider.value + 1;
        slider.value = next;
        render(next, true);
        if (next >= total) stop();
      }, reduce ? 120 : 620);
    });
  }
  slider.addEventListener("pointerdown", stop);
  slider.addEventListener("keydown", stop);

  /* --- Base inspector -----------------------------------------------
     Two different questions, so two different panels. Tapping one of ours
     asks "are they pulling their weight and what can they field"; tapping an
     enemy asks "is this base worth another attack and who has tried".

     Everything attack-derived is recomputed at the scrubbed point, so the
     panel never claims something that had not happened yet. */
  var panel = document.getElementById("base-detail");
  var selected = null;
  var byTag = {};
  W.roster.forEach(function (m) { byTag[m.tag] = m; });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function starStr(n) {
    return '<span class="s">' + "★".repeat(n) + '</span>' +
           '<span class="s off">' + "★".repeat(3 - n) + "</span>";
  }
  function row(a, verb, otherTag) {
    var o = byTag[otherTag];
    return '<li><span class="n">#' + a.n + "</span>" +
           '<span class="w">' + esc(verb) + " <b>" + esc(o ? o.name : "unknown") + "</b>" +
           (o ? ' <span class="t">TH' + o.th + "</span>" : "") + "</span>" +
           '<span class="r">' + starStr(a.s) + " " + a.d + "%</span></li>";
  }
  function block(label, body) {
    return '<div class="grp"><span class="k">' + label + '</span><div class="v">' + body + "</div></div>";
  }
  function pips(used, of) {
    var out = "";
    for (var i = 0; i < of; i++) out += '<i class="' + (i < used ? "used" : "") + '"></i>';
    return '<span class="pips">' + out + "</span>";
  }

  function describe(tag) {
    var t = +slider.value, m = byTag[tag];
    if (!m) return "";
    var made = [], got = [], best = 0, bestPct = 0;
    W.attacks.forEach(function (a) {
      if (a.n > t) return;
      if (a.by === tag) made.push(a);
      if (a.on === tag) { got.push(a); if (a.s > best) best = a.s; if (a.d > bestPct) bestPct = a.d; }
    });
    var stars = made.reduce(function (n, a) { return n + a.s; }, 0);
    var per = W.perMember || 1;

    var h = '<div class="bd-head"><h3>' + esc(m.name) + "</h3>" +
            '<span class="meta">#' + m.pos + " · TH" + m.th +
            (m.role ? " · " + esc(m.role) : "") + "</span></div>";

    if (m.side === "clan") {
      /* --- one of ours --- */
      if (m.orders) h += block("Orders", "Hit <b>" + esc(m.orders) + "</b>");
      if (m.army) {
        var army = "<b>" + esc(m.army.name) + "</b>" +
          (m.army.atLevel ? "" : ' <span class="tagi">lower-TH army</span>') +
          '<div class="sm">' + esc(m.army.troops) + "</div>";
        if (m.army.spells) army += '<div class="sm">Spells: ' + esc(m.army.spells) + "</div>";
        if (!m.army.ok && m.army.blockers.length)
          army += '<div class="sm warn">Blocked: ' + esc(m.army.blockers.join("; ")) + "</div>";
        h += block("Army", army);
        if (m.army.steps && m.army.steps.length) {
          h += block("Walkthrough", '<ol class="steps">' +
            m.army.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>");
        }
      }
      h += block("This war",
        pips(made.length, per) + " " + made.length + " of " + per + " used · <b>" +
        stars + "★</b>" +
        (made.length ? '<ul>' + made.map(function (a) { return row(a, "hit", a.on); }).join("") + "</ul>"
                     : '<div class="sm none">No attacks yet.</div>'));
      h += block("Defence", got.length
        ? starStr(best) + " conceded · " + bestPct + "%<ul>" +
          got.map(function (a) { return row(a, "hit by", a.by); }).join("") + "</ul>"
        : '<span class="sm none">Never attacked.</span>');
      if (m.heroes && Object.keys(m.heroes).length) {
        h += block("Heroes", Object.keys(m.heroes).map(function (k) {
          return '<span class="hero">' + k + " <b>" + m.heroes[k] + "</b></span>";
        }).join(""));
      }
      if (m.record) {
        h += block("Record", m.record.wars + (m.record.wars === 1 ? " war" : " wars") +
          " · " + m.record.usage + "% usage" +
          (m.record.three !== null ? " · " + m.record.three + "% three-star" : ""));
      }
    } else {
      /* --- an enemy base --- */
      var left = 3 - best;
      h += block("Status", starStr(best) + " · <b>" + left + "</b> star" + (left === 1 ? "" : "s") +
        " still available" + (got.length ? " · " + bestPct + "% best" : ""));
      h += block("Attempts", got.length
        ? "<ul>" + got.map(function (a) { return row(a, "by", a.by); }).join("") + "</ul>"
        : '<span class="sm none">Nobody has attacked this base yet.</span>');

      var verdict;
      if (best === 3) verdict = "Cleared. Do not spend an attack here.";
      else if (!got.length) verdict = "Untouched — no information yet. Expect it to behave like a TH" + m.th + ".";
      else if (best === 2) verdict = "One star left. A clean follow-up takes it.";
      else if (got.length >= 2) verdict = got.length + " attacks for " + best + " star" +
        (best === 1 ? "" : "s") + ". Treat this as genuinely hard, not unlucky.";
      else verdict = "One attempt reached " + best + " star" + (best === 1 ? "" : "s") + ".";
      h += block("Verdict", verdict);

      h += block("Their offence", made.length
        ? pips(made.length, per) + " " + stars + "★ taken from us<ul>" +
          made.map(function (a) { return row(a, "hit", a.on); }).join("") + "</ul>"
        : '<span class="sm none">Has not attacked us yet.</span>');
      if (m.from) {
        h += block("Assigned", "<b>" + esc(m.from.name) + "</b> (TH" + m.from.th + ")" +
          (m.from.over ? ' <span class="warn">— ' + m.from.over + " levels under</span>" : ""));
      }
    }
    return h;
  }

  function select(tile) {
    if (selected === tile) {
      selected.classList.remove("sel");
      selected.setAttribute("aria-expanded", "false");
      selected = null; panel.hidden = true; return;
    }
    if (selected) {
      selected.classList.remove("sel");
      selected.setAttribute("aria-expanded", "false");
    }
    selected = tile;
    tile.classList.add("sel");
    tile.setAttribute("aria-expanded", "true");
    panel.className = "base-detail " + (tile.dataset.side === "clan" ? "ours" : "theirs");
    panel.innerHTML = describe(tile.dataset.tag);
    panel.hidden = false;
  }

  document.querySelectorAll(".tile[data-tag]").forEach(function (tile) {
    tile.addEventListener("click", function () { select(tile); });
  });

  slider.addEventListener("input", function () {
    if (selected) panel.innerHTML = describe(selected.dataset.tag);
  });

  render(+slider.value, false);
})();
</script>
</body>
</html>
