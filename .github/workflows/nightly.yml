name: Nightly snapshot

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: telemetry-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --frozen

      - name: Snapshot roster, players and capital raids
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
        run: uv run coc-telemetry nightly

      - name: Commit captures
        run: .github/commit-data.sh "nightly snapshot"
